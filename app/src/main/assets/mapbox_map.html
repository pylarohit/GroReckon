<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=10.0, user-scalable=yes" />
  <title>Mapbox Ride Tracking with Start & Destination Routing</title>
  <link rel="stylesheet" href="mapbox-gl.css" />
  <script src="mapbox-gl.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #map canvas {
      touch-action: none;
      outline: none;
    }
    
    /* Custom User Vehicle Marker */
    .user-marker {
      width: 48px;
      height: 48px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .user-pulse {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.28);
      animation: pulse 2s infinite ease-out;
    }
    .user-arrow-wrapper {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #1d4ed8;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 16px rgba(29, 78, 216, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.2, 0, 1, 1);
    }
    .user-arrow {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 13px solid #ffffff;
      transform: translateY(-1px);
    }
    .user-marker.dr-mode .user-arrow-wrapper {
      background: #f59e0b !important;
      border-color: #fef3c7 !important;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.95), 0 4px 16px rgba(245, 158, 11, 0.8) !important;
    }
    .user-marker.dr-mode .user-pulse {
      background: rgba(245, 158, 11, 0.55) !important;
      animation: dr-pulse 1.1s infinite !important;
    }
    @keyframes dr-pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* Start Location Pin Marker (Green) */
    .start-marker {
      width: 38px;
      height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      animation: bounce 0.45s ease-out;
    }
    .start-pin {
      width: 34px;
      height: 34px;
      border-radius: 50% 50% 50% 0;
      background: #0f9d58;
      transform: rotate(-45deg);
      border: 3px solid #ffffff;
      box-shadow: 0 4px 14px rgba(15, 157, 88, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .start-pin-icon {
      transform: rotate(45deg);
      font-size: 14px;
      color: #ffffff;
      font-weight: bold;
    }

    /* Destination Pin Marker (Red) */
    .dest-marker {
      width: 38px;
      height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      animation: bounce 0.45s ease-out;
    }
    .dest-pin {
      width: 34px;
      height: 34px;
      border-radius: 50% 50% 50% 0;
      background: #dc2626;
      transform: rotate(-45deg);
      border: 3px solid #ffffff;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dest-pin-icon {
      transform: rotate(45deg);
      font-size: 15px;
    }

    @keyframes bounce {
      0% { transform: translateY(-30px); opacity: 0; }
      60% { transform: translateY(4px); }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0.9; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    /* Hide standard Mapbox default clutter */
    .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    var map = null;
    var markerEl = null;
    var userMarker = null;
    var arrowWrapper = null;
    var startMarker = null;
    var destMarker = null;

    var userLat = 28.5355;
    var userLng = 77.1000;
    var customStartLat = null;
    var customStartLng = null;
    var destLat = null;
    var destLng = null;

    var rideCoords = [];
    var plannedRouteCoords = [];
    var currentHeading = 0;
    var isMapReady = false;
    var is3dEnabled = false; // Normal 2D mode by default
    var isRideRunning = false;
    var currentStyle = 'streets'; // 'streets' or 'satellite'

    // Dual GeoJSON Segments: Solid Green (GPS) and Dashed Red (AI Dead Reckoning Outage)
    var gpsSegments = [];
    var drSegments = [];
    var currentSegment = [];
    var lastMode = null; // 'gps' or 'dr'
    var lastCoord = null;

    // Auto-rotate and camera gesture control state
    var isUserControllingCamera = false;
    var autoFollowTimer = null;
    var isAutoRotateEnabled = true;

    function setUserControlling(active) {
      isUserControllingCamera = active;
      if (autoFollowTimer) {
        clearTimeout(autoFollowTimer);
        autoFollowTimer = null;
      }
    }

    function scheduleAutoFollow() {
      if (autoFollowTimer) clearTimeout(autoFollowTimer);
      // After 5 seconds of idle user touch, smoothly resume auto-following along the route
      autoFollowTimer = setTimeout(function() {
        isUserControllingCamera = false;
      }, 5000);
    }

    function initMapbox(token, initialLat, initialLng, startHeading) {
      if (!token) {
        console.error("Mapbox token is missing!");
        return;
      }
      mapboxgl.accessToken = token;
      userLat = initialLat;
      userLng = initialLng;

      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [initialLng, initialLat],
        zoom: 16.2,
        pitch: is3dEnabled ? 65 : 0, // 0 for normal 2D
        maxPitch: 85,
        bearing: 0, // Normal North-up
        attributionControl: false
      });

      // Explicitly enable all multi-touch gestures: pinch to zoom, two-finger rotate, pan, and tilt
      if (map.touchZoomRotate) {
        map.touchZoomRotate.enable();
        if (typeof map.touchZoomRotate.enableRotation === 'function') {
          map.touchZoomRotate.enableRotation();
        }
      }
      if (map.touchPitch) map.touchPitch.enable();
      if (map.dragRotate) map.dragRotate.enable();
      if (map.dragPan) map.dragPan.enable();
      if (map.scrollZoom) map.scrollZoom.enable();

      // Disable default double-click zoom so double clicking selects destination smoothly!
      map.doubleClickZoom.disable();

      // ── Gesture Tracking: Prevent Camera easeTo from interrupting user zoom/rotate ──
      map.on('touchstart', function(e) {
        if (e.originalEvent && e.originalEvent.touches && e.originalEvent.touches.length >= 2) {
          setUserControlling(true);
        }
      });
      map.on('dragstart', function() { setUserControlling(true); });
      map.on('rotatestart', function() { setUserControlling(true); });
      map.on('pitchstart', function() { setUserControlling(true); });
      map.on('zoomstart', function(e) {
        if (e.originalEvent) setUserControlling(true);
      });

      map.on('touchend', function(e) {
        if (!e.originalEvent || !e.originalEvent.touches || e.originalEvent.touches.length === 0) {
          scheduleAutoFollow();
        }
      });
      map.on('dragend', function() { scheduleAutoFollow(); });
      map.on('rotateend', function() { scheduleAutoFollow(); });
      map.on('pitchend', function() { scheduleAutoFollow(); });
      map.on('zoomend', function(e) {
        if (e.originalEvent) scheduleAutoFollow();
      });

      map.on('style.load', function() {
        setupMapLayers();
      });

      map.on('load', function() {
        // Setup User Vehicle Marker
        markerEl = document.createElement('div');
        markerEl.className = 'user-marker';
        markerEl.innerHTML = '<div class="user-pulse"></div><div class="user-arrow-wrapper"><div class="user-arrow"></div></div>';
        arrowWrapper = markerEl.querySelector('.user-arrow-wrapper');

        userMarker = new mapboxgl.Marker({
          element: markerEl,
          rotationAlignment: 'map'
        })
        .setLngLat([initialLng, initialLat])
        .addTo(map);

        setHeading(startHeading || 0);

        // Native dblclick event
        map.on('dblclick', function(e) {
          onMapDoubleAction(e.lngLat.lat, e.lngLat.lng);
        });

        // Fast tap double-click fallback for touch WebView devices
        map.on('click', function(e) {
          var now = new Date().getTime();
          if (now - lastClickTime < 360) {
            onMapDoubleAction(e.lngLat.lat, e.lngLat.lng);
            lastClickTime = 0;
          } else {
            lastClickTime = now;
          }
        });

        isMapReady = true;
        if (window.TrackRideInterface && window.TrackRideInterface.onMapLoaded) {
          window.TrackRideInterface.onMapLoaded();
        }
      });
    }

    function onMapDoubleAction(lat, lng) {
      if (isRideRunning) return; // Ignore while ride in progress
      if (window.TrackRideInterface && window.TrackRideInterface.onMapDoubleClicked) {
        window.TrackRideInterface.onMapDoubleClicked(lat, lng);
      } else {
        setDestination(lat, lng);
      }
    }

    function setupMapLayers() {
      if (!map) return;

      // ── 1. 3D Building Extrusions Layer (Only visible in 3D mode) ─────────
      if (!map.getLayer('3d-buildings')) {
        var layers = map.getStyle().layers;
        var labelLayerId = null;
        for (var i = 0; i < layers.length; i++) {
          if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) {
            labelLayerId = layers[i].id;
            break;
          }
        }

        map.addLayer(
          {
            'id': '3d-buildings',
            'source': 'composite',
            'source-layer': 'building',
            'filter': ['==', 'extrude', 'true'],
            'type': 'fill-extrusion',
            'minzoom': 13.5,
            'layout': {
              'visibility': is3dEnabled ? 'visible' : 'none'
            },
            'paint': {
              'fill-extrusion-color': [
                'interpolate',
                ['linear'],
                ['get', 'height'],
                0, '#d1d5db',
                30, '#94a3b8',
                70, '#64748b',
                120, '#475569'
              ],
              'fill-extrusion-height': [
                'interpolate',
                ['linear'],
                ['zoom'],
                13.5, 0,
                14.5, ['get', 'height']
              ],
              'fill-extrusion-base': [
                'interpolate',
                ['linear'],
                ['zoom'],
                13.5, 0,
                14.5, ['get', 'min_height']
              ],
              'fill-extrusion-opacity': 0.88
            }
          },
          labelLayerId
        );
      } else {
        map.setLayoutProperty('3d-buildings', 'visibility', is3dEnabled ? 'visible' : 'none');
      }

      // ── 2. Atmospheric Sky Layer ─────────────────────────────────────────
      if (!map.getLayer('sky')) {
        try {
          map.addLayer({
            'id': 'sky',
            'type': 'sky',
            'layout': {
              'visibility': is3dEnabled ? 'visible' : 'none'
            },
            'paint': {
              'sky-type': 'atmosphere',
              'sky-atmosphere-sun': [0.0, 90.0],
              'sky-atmosphere-sun-intensity': 15
            }
          });
        } catch (e) {}
      } else {
        try {
          map.setLayoutProperty('sky', 'visibility', is3dEnabled ? 'visible' : 'none');
        } catch(e) {}
      }

      // ── 3. Planned Route GeoJSON Layer ───────────────────────────────────
      if (!map.getSource('planned-route')) {
        map.addSource('planned-route', {
          type: 'geojson',
          data: {
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'LineString',
              coordinates: plannedRouteCoords
            }
          }
        });

        // Planned route casing glow
        map.addLayer({
          id: 'planned-route-glow',
          type: 'line',
          source: 'planned-route',
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#60a5fa',
            'line-width': 12,
            'line-opacity': 0.45
          }
        });

        // Planned route core line
        map.addLayer({
          id: 'planned-route-core',
          type: 'line',
          source: 'planned-route',
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#2563eb',
            'line-width': 6,
            'line-opacity': 0.95
          }
        });
      } else {
        var pSrc = map.getSource('planned-route');
        if (pSrc) {
          pSrc.setData({
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'LineString',
              coordinates: plannedRouteCoords
            }
          });
        }
      }

      // ── 4. Traveled Ride Path GeoJSON Layers (GPS Solid Green & Outage Dashed Red) ──
      // 4A. Solid Emerald Green Path for GNSS Active
      if (!map.getSource('ride-path-gps')) {
        map.addSource('ride-path-gps', {
          type: 'geojson',
          data: {
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'MultiLineString',
              coordinates: gpsSegments
            }
          }
        });

        // Traveled GPS outer glow
        map.addLayer({
          id: 'ride-path-gps-glow',
          type: 'line',
          source: 'ride-path-gps',
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#34d399',
            'line-width': 12,
            'line-opacity': 0.45
          }
        });

        // Traveled GPS core line
        map.addLayer({
          id: 'ride-path-gps-core',
          type: 'line',
          source: 'ride-path-gps',
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#059669',
            'line-width': 6,
            'line-opacity': 1.0
          }
        });
      } else {
        var gSrc = map.getSource('ride-path-gps');
        if (gSrc) {
          gSrc.setData({
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'MultiLineString',
              coordinates: gpsSegments
            }
          });
        }
      }

      // 4B. Dashed Vivid Red Path for GPS Lost / AI Dead Reckoning
      if (!map.getSource('ride-path-dr')) {
        map.addSource('ride-path-dr', {
          type: 'geojson',
          data: {
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'MultiLineString',
              coordinates: drSegments
            }
          }
        });

        // Traveled Dead Reckoning outer glow (red)
        map.addLayer({
          id: 'ride-path-dr-glow',
          type: 'line',
          source: 'ride-path-dr',
          layout: {
            'line-join': 'round',
            'line-cap': 'butt'
          },
          paint: {
            'line-color': '#f87171',
            'line-width': 12,
            'line-opacity': 0.45,
            'line-dasharray': [2.5, 2.0]
          }
        });

        // Traveled Dead Reckoning core line (dashed red)
        map.addLayer({
          id: 'ride-path-dr-core',
          type: 'line',
          source: 'ride-path-dr',
          layout: {
            'line-join': 'round',
            'line-cap': 'butt'
          },
          paint: {
            'line-color': '#ef4444',
            'line-width': 6,
            'line-opacity': 1.0,
            'line-dasharray': [2.5, 2.0]
          }
        });
      } else {
        var dSrc = map.getSource('ride-path-dr');
        if (dSrc) {
          dSrc.setData({
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'MultiLineString',
              coordinates: drSegments
            }
          });
        }
      }
    }

    // ── Set / Clear Start Location ────────────────────────────────────────
    function setStartLocation(lat, lng) {
      if (!isMapReady || !map) return;
      customStartLat = lat;
      customStartLng = lng;

      if (!startMarker) {
        var el = document.createElement('div');
        el.className = 'start-marker';
        el.innerHTML = '<div class="start-pin"><span class="start-pin-icon">🟢</span></div>';
        startMarker = new mapboxgl.Marker({ element: el })
          .setLngLat([customStartLng, customStartLat])
          .addTo(map);
      } else {
        startMarker.setLngLat([customStartLng, customStartLat]);
      }

      // If destination already set, recalculate shortest route!
      if (destLat !== null && destLng !== null) {
        triggerRouteCalculation();
      } else {
        map.flyTo({ center: [customStartLng, customStartLat], zoom: 16.0, duration: 600 });
      }
    }

    function clearStartLocation() {
      customStartLat = null;
      customStartLng = null;
      if (startMarker) {
        startMarker.remove();
        startMarker = null;
      }
      if (destLat !== null && destLng !== null) {
        triggerRouteCalculation();
      }
    }

    // ── Set / Clear Destination ───────────────────────────────────────────
    function setDestination(lat, lng) {
      if (!isMapReady || !map) return;
      destLat = lat;
      destLng = lng;

      if (!destMarker) {
        var el = document.createElement('div');
        el.className = 'dest-marker';
        el.innerHTML = '<div class="dest-pin"><span class="dest-pin-icon">🏁</span></div>';
        destMarker = new mapboxgl.Marker({ element: el })
          .setLngLat([destLng, destLat])
          .addTo(map);
      } else {
        destMarker.setLngLat([destLng, destLat]);
      }

      triggerRouteCalculation();
    }

    function clearDestination() {
      destLat = null;
      destLng = null;
      plannedRouteCoords = [];
      if (destMarker) {
        destMarker.remove();
        destMarker = null;
      }
      if (map) {
        var pSrc = map.getSource('planned-route');
        if (pSrc) {
          pSrc.setData({
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'LineString',
              coordinates: []
            }
          });
        }
      }
    }

    // ── Trigger Route Calculation (Always Shortest & Best Road Route) ─────
    function triggerRouteCalculation() {
      if (destLat === null || destLng === null) return;

      var originLat = customStartLat !== null ? customStartLat : userLat;
      var originLng = customStartLng !== null ? customStartLng : userLng;

      var token = mapboxgl.accessToken;
      var url = 'https://api.mapbox.com/directions/v5/mapbox/driving/' +
        originLng + ',' + originLat + ';' + destLng + ',' + destLat +
        '?alternatives=true&geometries=geojson&overview=full&steps=true&access_token=' + token;

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
            // Sort to always pick the shortest & best road route
            var routes = data.routes;
            routes.sort(function(a, b) {
              return a.distance - b.distance; // Shortest distance first
            });
            var bestRoute = routes[0];
            var distKm = (bestRoute.distance / 1000.0).toFixed(2);
            var durMin = Math.max(1, Math.round(bestRoute.duration / 60.0));
            plannedRouteCoords = bestRoute.geometry.coordinates;

            // Draw route on map
            var pSrc = map.getSource('planned-route');
            if (pSrc) {
              pSrc.setData({
                type: 'Feature',
                properties: {},
                geometry: {
                  type: 'LineString',
                  coordinates: plannedRouteCoords
                }
              });
            }

            // Smoothly frame both points & route
            var bounds = new mapboxgl.LngLatBounds();
            bounds.extend([originLng, originLat]);
            bounds.extend([destLng, destLat]);
            plannedRouteCoords.forEach(function(c) { bounds.extend(c); });
            map.fitBounds(bounds, {
              padding: { top: 180, bottom: 280, left: 60, right: 60 },
              duration: 900
            });

            // Notify Android
            if (window.TrackRideInterface) {
              if (window.TrackRideInterface.onRouteCalculated) {
                window.TrackRideInterface.onRouteCalculated(
                  parseFloat(distKm), 
                  durMin, 
                  originLat, 
                  originLng, 
                  destLat, 
                  destLng
                );
              }
              if (window.TrackRideInterface.onRouteCoordinates) {
                window.TrackRideInterface.onRouteCoordinates(JSON.stringify(plannedRouteCoords));
              }
            }
          }
        })
        .catch(function(err) {
          console.error("Routing error:", err);
          // Straight line fallback
          plannedRouteCoords = [[originLng, originLat], [destLng, destLat]];
          var pSrc = map.getSource('planned-route');
          if (pSrc) {
            pSrc.setData({
              type: 'Feature',
              properties: {},
              geometry: {
                type: 'LineString',
                coordinates: plannedRouteCoords
              }
            });
          }
          if (window.TrackRideInterface && window.TrackRideInterface.onRouteCalculated) {
            window.TrackRideInterface.onRouteCalculated(10.5, 18, originLat, originLng, destLat, destLng);
          }
        });
    }

    function setHeading(deg) {
      currentHeading = deg;
      if (arrowWrapper) {
        arrowWrapper.style.transform = 'rotate(' + deg + 'deg)';
      }
    }

    function updateUserLocation(lat, lng, headingDeg, isDeadReckoning) {
      userLat = lat;
      userLng = lng;
      currentHeading = headingDeg;
      if (!isMapReady || !map || !userMarker) return;

      userMarker.setLngLat([lng, lat]);
      setHeading(headingDeg);

      if (isDeadReckoning) {
        markerEl.classList.add('dr-mode');
      } else {
        markerEl.classList.remove('dr-mode');
      }

      // If ride or demo is running: smoothly track with camera and always rotate to the direction we are going
      if (isRideRunning) {
        // Only track camera if user is not currently pinch-zooming, unzooming, rotating, or panning!
        if (!isUserControllingCamera) {
          map.easeTo({
            center: [lng, lat],
            bearing: headingDeg,
            pitch: is3dEnabled ? 65 : 0,
            duration: 180,
            easing: function(t) { return t; }
          });
        }
      }
    }

    function addRidePoint(lat, lng, isDeadReckoning) {
      if (!map) return;
      var isDr = Boolean(isDeadReckoning);
      var mode = isDr ? 'dr' : 'gps';
      var pt = [lng, lat];

      if (lastMode === null) {
        lastMode = mode;
        currentSegment = [pt];
        if (isDr) {
          drSegments.push(currentSegment);
        } else {
          gpsSegments.push(currentSegment);
        }
      } else if (lastMode !== mode) {
        // Seamless mode transition (GPS <-> AI Dead Reckoning) with shared connecting coordinate
        lastMode = mode;
        currentSegment = lastCoord ? [lastCoord, pt] : [pt];
        if (isDr) {
          drSegments.push(currentSegment);
        } else {
          gpsSegments.push(currentSegment);
        }
      } else {
        currentSegment.push(pt);
      }
      lastCoord = pt;

      var gSrc = map.getSource('ride-path-gps');
      if (gSrc) {
        gSrc.setData({
          type: 'Feature',
          properties: {},
          geometry: {
            type: 'MultiLineString',
            coordinates: gpsSegments
          }
        });
      }

      var dSrc = map.getSource('ride-path-dr');
      if (dSrc) {
        dSrc.setData({
          type: 'Feature',
          properties: {},
          geometry: {
            type: 'MultiLineString',
            coordinates: drSegments
          }
        });
      }
    }

    function clearRidePath() {
      gpsSegments = [];
      drSegments = [];
      currentSegment = [];
      lastMode = null;
      lastCoord = null;
      if (map) {
        var gSrc = map.getSource('ride-path-gps');
        if (gSrc) {
          gSrc.setData({
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'MultiLineString',
              coordinates: []
            }
          });
        }
        var dSrc = map.getSource('ride-path-dr');
        if (dSrc) {
          dSrc.setData({
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'MultiLineString',
              coordinates: []
            }
          });
        }
      }
    }

    function startRide() {
      isRideRunning = true;
      setUserControlling(false);
      var centerLng = customStartLng !== null ? customStartLng : userLng;
      var centerLat = customStartLat !== null ? customStartLat : userLat;
      if (map) {
        map.flyTo({
          center: [centerLng, centerLat],
          zoom: map.getZoom() || 16.5,
          pitch: is3dEnabled ? 65 : 0,
          bearing: currentHeading,
          speed: 1.4,
          curve: 1
        });
      }
    }

    function stopRide() {
      isRideRunning = false;
      setUserControlling(false);
      clearDestination();
      clearStartLocation();
      clearRidePath();
      if (map) {
        map.easeTo({
          center: [userLng, userLat],
          zoom: 16.2,
          pitch: is3dEnabled ? 65 : 0,
          bearing: 0,
          duration: 600
        });
      }
    }

    function recenter(lat, lng, zoom) {
      if (!map) return;
      setUserControlling(false);
      var targetZoom = zoom || map.getZoom() || (is3dEnabled ? 16.8 : 16.2);
      map.flyTo({
        center: [lng, lat],
        zoom: targetZoom,
        pitch: is3dEnabled ? 65 : 0,
        bearing: currentHeading,
        speed: 1.5,
        curve: 1
      });
    }

    function setPerspective(is3d) {
      if (!map) return;
      is3dEnabled = is3d;

      // 1. Hide 3D building extrusions in 2D mode so map is completely normal flat
      if (map.getLayer('3d-buildings')) {
        map.setLayoutProperty('3d-buildings', 'visibility', is3d ? 'visible' : 'none');
      }

      // 2. Hide sky atmosphere in 2D mode
      if (map.getLayer('sky')) {
        try {
          map.setLayoutProperty('sky', 'visibility', is3d ? 'visible' : 'none');
        } catch(e) {}
      }

      // In 2D mode: pitch to 0. Auto-rotate along travel route bearing!
      // In 3D mode: pitch to 65.
      map.easeTo({
        pitch: is3d ? 65 : 0,
        bearing: currentHeading,
        duration: 500
      });
    }

    function toggleSatellite(isSatellite) {
      if (!map) return;
      currentStyle = isSatellite ? 'satellite' : 'streets';
      var styleUrl = isSatellite 
        ? 'mapbox://styles/mapbox/satellite-streets-v12'
        : 'mapbox://styles/mapbox/streets-v12';
      map.setStyle(styleUrl);
    }
  </script>
</body>
</html>
